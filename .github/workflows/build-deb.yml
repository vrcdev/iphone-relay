name: build-deb

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ldid dpkg

      - name: Cross-compile sockd (arm64e, iOS 14.0+)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64e -isysroot "$SDK" -miphoneos-version-min=14.0 \
                -O2 -Wall -std=c99 -o sockd src/*.c -lpthread
          ldid -S sockd

      - name: Cross-compile SockdPane preference bundle
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64e -isysroot "$SDK" -miphoneos-version-min=14.0 \
                -O2 -fobjc-arc -bundle -o SockdPane \
                src/Preferences/SockdRootListController.m \
                -framework Foundation -framework UIKit \
                -undefined dynamic_lookup
          ldid -S SockdPane

      - name: Cross-compile SockdApp status app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64e -isysroot "$SDK" -miphoneos-version-min=14.0 \
                -O2 -fobjc-arc -o SockdApp src/App/main.m \
                -framework Foundation -framework UIKit
          ldid -Ssrc/App/entitlements.plist SockdApp

      - name: Assemble rootless .deb
        run: |
          mkdir -p pkg/var/jb/usr/libexec \
                   pkg/var/jb/Library/PreferenceBundles/SockdPane.bundle \
                   pkg/var/jb/Applications/SockdApp.app
          cp sockd pkg/var/jb/usr/libexec/
          cp SockdPane src/Preferences/Resources/* \
             pkg/var/jb/Library/PreferenceBundles/SockdPane.bundle/
          cp SockdApp src/App/Info.plist pkg/var/jb/Applications/SockdApp.app/
          chmod 755 pkg/var/jb/usr/libexec/sockd \
                    pkg/var/jb/Library/PreferenceBundles/SockdPane.bundle/SockdPane \
                    pkg/var/jb/Applications/SockdApp.app/SockdApp
          cp -r layout/* pkg/
          chmod 755 pkg/DEBIAN/postinst
          dpkg-deb --build --root-owner-group pkg com.vrcdev.sockd_1.2.1_iphoneos-arm64.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: sockd-deb
          path: com.vrcdev.sockd_1.2.1_iphoneos-arm64.deb
